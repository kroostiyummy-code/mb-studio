# Settings du site — édité par Mike avant brief patron, puis raffiné par le patron via Decap CMS
# Le patron ne touche JAMAIS : signature, accent_override, sections, mode (pilotés par Mike)
# La clé racine `site:` est requise par Astro Content Collections (loader file()).

site:
  nom: "Kroosti Yummy"
  slogan: "Le 1er Riz Kroosti à Chartres"
  baseline: "Foodtruck halal · Tout fait maison · 170+ avis 5★"
  est_year: 2023
  ville: "Chartres"
  region_code: "FR-28"

  # Signature pilotée par Mike d'après la question identité au brief
  signature: "brutalist"

  # Dominante = couleur du patron (color picker Decap)
  dominante: "#8b0e0e"

  # accent_override : champ Mike, jamais exposé Decap. Décommenter en cas de conflit visuel.
  # accent_override: "#ffec00"

  prix_appel: "13,90€"
  telephone: "+33749592462"
  telephone_display: "07 49 59 24 62"
  adresse: "Chartres · Eure-et-Loir"
  geo:
    lat: 48.4469
    lng: 1.4886

  google_avis_url: "https://share.google/pV3doyAtlEjtCqBzA"

  reseaux:
    instagram: "https://www.instagram.com/kroosti.yummy"
    facebook: "https://www.facebook.com/share/18PF6q7NQT/"
    snapchat: "https://www.snapchat.com/add/kroostiyummy"

  hero_image: "/images/foodtruck.jpg"
  hero_image_alt: "Kroosti Yummy — foodtruck halal à Chartres"

  # Combo banner du menu (optionnel). Mis en avant en haut de la section Menu si active.
  combo:
    active: true
    tag: "★ COMBO"
    formule: "RIZ + CROQ + BOISSON"
    prix: "13,90"

  # Bloc Réservation (textes éditables par patron). Si absent, défauts dans le composant.
  reservation:
    kicker: "Pas envie de faire la queue ?"
    titre: "Réservez votre commande."
    perks:
      - "Évitez la queue"
      - "Prêt à votre arrivée"
      - "Service rapide"

  # Mode de localisation : "fixe" (resto avec 1 adresse) ou "foodtruck" (tournées hebdo).
  # Kroosti = foodtruck. Les 5 premiers clients resto = "fixe".
  mode: "foodtruck"

  # Google Maps embed (mode fixe uniquement). Le patron récupère le src d'iframe via
  # Maps > Partager > Intégrer une carte > Copier le code, et colle le src ici.
  # google_maps_embed_url: "https://www.google.com/maps/embed?pb=..."

  # Mode fixe : horaires hebdomadaires structurés (ignorés si mode = foodtruck)
  # horaires:
  #   - jour: "lundi"
  #     creneaux: []   # fermé
  #   - jour: "mardi"
  #     creneaux:
  #       - { ouvre: "12:00", ferme: "14:00" }
  #       - { ouvre: "19:00", ferme: "22:30" }

  # Mode foodtruck : tournée hebdo (un créneau par lieu, midi ou soir)
  horaires_foodtruck:
    - jour: "lundi"
      creneaux: []
    - jour: "mardi"
      creneaux:
        - { lieu: "Mail Vieux Puits", ville: "Lucé", moment: "midi", ouvre: "11:30", ferme: "13:30" }
    - jour: "mercredi"
      creneaux:
        - { lieu: "Marché Chartres", ville: "Bd Chasles", moment: "midi", ouvre: "11:30", ferme: "13:30" }
        - { lieu: "La Poste", ville: "Luisant", moment: "soir", ouvre: "18:30", ferme: "20:30" }
    - jour: "jeudi"
      creneaux:
        - { lieu: "Place Marché", ville: "Mainvilliers", moment: "soir", ouvre: "18:30", ferme: "20:30" }
    - jour: "vendredi"
      creneaux: []
    - jour: "samedi"
      creneaux:
        - { lieu: "Leroy Merlin", ville: "Chartres", moment: "midi", ouvre: "11:30", ferme: "13:30" }
        - { lieu: "33 r. Mal Leclerc", ville: "Lucé", moment: "soir", ouvre: "18:30", ferme: "20:30" }
    - jour: "dimanche"
      creneaux: []

  # ON/OFF des sections (pilotage Mike, exposé Decap comme toggles)
  sections:
    bandeau: true
    histoire: true
    avis: true
    reservation: true
    menu: true
    exigence: true
    galerie: true    # 6 photos dans galerie.yml, seuil 4 respecté
    localisation: true
    reseaux: true
