# Decap CMS — interface d'édition exposée au patron du resto
# Frontière à respecter : le patron ne voit JAMAIS les champs `signature` et `accent_override`
# (ils sont contrôlés par Mike via le frontmatter du brief, voir CLAUDE.md).

backend:
  name: github
  repo: USER/REPO   # à customiser par client lors de la création du repo
  branch: main

# Permet l'édition en local via `npx decap-server`
local_backend: true

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "settings"
    label: "Paramètres du site"
    description: "Informations générales du restaurant"
    files:
      - name: "site"
        label: "Site"
        file: "src/content/settings/site.yml"
        fields:
          - { name: nom, label: "Nom du restaurant", widget: string }
          - { name: slogan, label: "Slogan (1 ligne)", widget: string }
          - { name: baseline, label: "Sous-slogan (optionnel)", widget: string, required: false }
          - { name: est_year, label: "Année de lancement", widget: number }
          - { name: ville, label: "Ville", widget: string }
          - { name: region_code, label: "Code région (ex: FR-28)", widget: string }
          - { name: dominante, label: "Couleur dominante", widget: color, allowInput: true, hint: "Couleur principale de votre enseigne (ex: #8b0e0e)" }
          - { name: prix_appel, label: "Prix d'appel (optionnel)", widget: string, required: false, hint: "Ex: 13,90€" }
          - { name: telephone, label: "Téléphone (format international)", widget: string, hint: "Ex: +33749592462" }
          - { name: telephone_display, label: "Téléphone (à afficher)", widget: string, hint: "Ex: 07 49 59 24 62" }
          - { name: adresse, label: "Adresse", widget: string, required: false }
          - { name: hero_image, label: "Photo principale", widget: image }
          - { name: hero_image_alt, label: "Description de la photo (pour Google et l'accessibilité)", widget: string }
          - { name: google_avis_url, label: "Lien vers vos avis Google", widget: string, required: false }
          - name: combo
            label: "Combo / Formule mise en avant"
            widget: object
            required: false
            collapsed: true
            hint: "Optionnel : une formule à mettre en avant en haut du menu (ex: Menu complet 13,90€)"
            fields:
              - { name: active, label: "Afficher le combo", widget: boolean, default: false }
              - { name: tag, label: "Étiquette", widget: string, default: "★ COMBO" }
              - { name: formule, label: "Formule (séparée par +)", widget: string, hint: "Ex: RIZ + CROQ + BOISSON" }
              - { name: prix, label: "Prix (sans €)", widget: string, hint: "Ex: 13,90" }
          - name: reservation
            label: "Bloc Réservation (textes personnalisables)"
            widget: object
            required: false
            collapsed: true
            hint: "Si vous laissez vide, des textes par défaut s'afficheront."
            fields:
              - { name: kicker, label: "Petite phrase d'accroche", widget: string, required: false, hint: "Ex: Pas envie de faire la queue ?" }
              - { name: titre, label: "Titre principal", widget: string, required: false, hint: "Ex: Réservez votre table." }
              - { name: perks, label: "Avantages (3 max)", widget: list, default: [], required: false, hint: "Ex: Service rapide, Accueil chaleureux, À votre arrivée" }
          - name: reseaux
            label: "Réseaux sociaux"
            widget: object
            required: false
            collapsed: true
            fields:
              - { name: instagram, label: "Lien Instagram", widget: string, required: false }
              - { name: facebook, label: "Lien Facebook", widget: string, required: false }
              - { name: tiktok, label: "Lien TikTok", widget: string, required: false }
              - { name: snapchat, label: "Lien Snapchat", widget: string, required: false }
          - name: sections
            label: "Sections à afficher sur la page"
            widget: object
            fields:
              - { name: bandeau, label: "Bandeau d'actualités en haut", widget: boolean, default: false }
              - { name: histoire, label: "Notre histoire", widget: boolean, default: true }
              - { name: avis, label: "Avis Google", widget: boolean, default: true, hint: "Auto-caché si note < 4 ou moins de 20 avis" }
              - { name: reservation, label: "Réservation", widget: boolean, default: true }
              - { name: menu, label: "La carte", widget: boolean, default: true }
              - { name: exigence, label: "Notre exigence (fait maison, local, halal…)", widget: boolean, default: false }
              - { name: galerie, label: "Galerie photos", widget: boolean, default: true, hint: "Auto-cachée si moins de 4 photos" }
              - { name: localisation, label: "Où nous trouver", widget: boolean, default: true }
              - { name: reseaux, label: "Réseaux sociaux", widget: boolean, default: false }

  - name: "galerie"
    label: "Galerie photo"
    description: "Photos affichées dans la section Galerie. Minimum 4 photos pour que la section s'affiche (auto-hide sinon)."
    files:
      - name: "galerie"
        label: "Galerie"
        file: "src/content/galerie/galerie.yml"
        fields:
          - name: photos
            label: "Photos"
            label_singular: "Photo"
            widget: list
            min: 0
            hint: "Ajoutez au moins 4 photos pour que la section s'affiche. Idéal : 6 à 12 photos (plats, salle, équipe)."
            fields:
              - { name: src, label: "Photo", widget: image }
              - { name: alt, label: "Description (pour Google et l'accessibilité)", widget: string }
              - { name: legende, label: "Légende (optionnelle)", widget: string, required: false }

  - name: "menu"
    label: "Carte (sections du menu)"
    label_singular: "Section de menu"
    description: "Une section par fichier (Entrées, Plats, Desserts, Boissons, etc.). Les sections s'affichent dans l'ordre indiqué."
    folder: "src/content/menu/sections"
    format: "yml"
    extension: "yml"
    create: true
    slug: "{{slug}}"
    identifier_field: nom_section
    fields:
      - { name: ordre, label: "Ordre d'apparition", widget: number, default: 1, value_type: int }
      - { name: nom_section, label: "Nom de la section", widget: string, hint: "Ex: Entrées, Plats, Desserts, Boissons" }
      - name: items
        label: "Plats de cette section"
        label_singular: "Plat"
        widget: list
        fields:
          - { name: nom, label: "Nom du plat", widget: string }
          - { name: description, label: "Description courte", widget: text }
          - { name: prix, label: "Prix (sans €)", widget: string, hint: "Ex: 10 ou 12,50" }
          - { name: allergenes, label: "Allergènes", widget: list, default: [], required: false, hint: "Un par champ : Gluten, Lait, Œuf, Fruits à coque, etc." }
