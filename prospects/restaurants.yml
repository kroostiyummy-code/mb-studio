# Liste prospects — SOURCE DE VÉRITÉ UNIQUE (voir README.md de ce dossier)
#
# Une entrée = un restaurant. Les outils créent/mettent à jour les blocs `scan` et
# `scoring` ; `pilote-client` écrit `tunnel` ; toi tu écris `notes_mike` et, si tu veux
# corriger un score, `scoring.mike_override` (jamais écrasé par les outils).
#
# L'entrée ci-dessous est un MODÈLE commenté (préfixe `_modele`). Ne pas la pitcher.
# Les vrais prospects arrivent via le scan `scoring-prospects`.

restaurants:
  - id: _modele                       # slug stable et unique, jamais réutilisé/renommé

    identite:
      nom: "Nom du restaurant"
      adresse: "12 rue Exemple"
      cp: "28000"
      ville: "Chartres"
      telephone: "inconnu"            # ou le numéro public
      cuisine: "inconnue"             # ex: pizzeria, bistrot, tradition
      site_actuel: "aucun"            # "aucun" | url eatbu | url autre

    scan:                             # rempli/MAJ par scoring-prospects
      date_scan: null                 # AAAA-MM-JJ
      note_google: null               # ex: 4.3
      nb_avis: null                   # ex: 87
      gmb_completude: null            # 0-100 (photos, horaires, description, catégories)
      lighthouse_mobile: null         # 0-100, ou null si non mesuré
      age_site_ans: null              # ancienneté du site, ou null si inconnu
      source_donnees: null            # osm | places | wayback | manuel

    scoring:                          # rempli/MAJ par scoring-prospects
      score: null                     # 0-100
      tier: null                      # A | B | C
      valeur: null                    # 0-100 (valeur qu'on peut apporter)
      proba: null                     # 0-100 (probabilité d'accepter)
      drapeau_rouge: "aucun"
      mike_override: null             # null OU { score: 72, raison: "bon feeling terrain" }

    tunnel:                           # écrit par pilote-client au fil du temps
      statut: a_qualifier             # a_qualifier|a_demarcher|maquette_vue|brief|acompte|prod|livre|suivi|perdu|exclu
      historique: []                  # liste de { date, etape, note } ajoutée à chaque passage
      argument_qui_a_converti: null
      raison_perte: null

    notes_mike: ""                    # libre, à toi — jamais écrasé par un outil

  - id: anamour-luce

    identite:
      nom: "Anamour"
      adresse: "54 Rue du Maréchal Leclerc"
      cp: "28110"
      ville: "Lucé"
      telephone: "+33237263214"
      cuisine: "restaurant turc moderne / grillades halal"
      site_actuel: "https://anamour-restaurant-luce.order.dish.co/menus"

    scan:
      date_scan: 2026-05-22
      note_google: 4.6
      nb_avis: 319
      gmb_completude: null            # à mesurer
      lighthouse_mobile: null         # pas mesuré (pas de clé PageSpeed)
      age_site_ans: null              # site actuel = dish.co, pas un site propre
      source_donnees: manuel          # ajouté manuellement par Mike, pas via scoring-prospects

    scoring:
      score: null                     # pas scoré officiellement (scan manuel)
      tier: null
      valeur: null
      proba: null
      drapeau_rouge: "aucun"
      mike_override:
        score: 86
        raison: "Tier A potentiel — très forte validation locale (4.6/319), identité de marque déjà construite (chezanamour.fr), gap digital énorme (dish.co fonctionnel mais pas émotionnel), patron probable ambitieux / sensible au branding, lieu physique premium sous-exploité côté digital. Voir analyse complète dans prospects/anamour-luce/analyse-prebrief.md."

    tunnel:
      statut: a_demarcher
      historique:
        - { date: 2026-05-22, etape: a_demarcher, note: "Pré-brief stratégique consigné dans prospects/anamour-luce/. Maquette à produire avant porte-à-porte." }
      argument_qui_a_converti: null
      raison_perte: null

    notes_mike: |
      Prochaine action : décider du format de maquette pré-brief (3 PNG signatures classiques
      maquette-flash, ou maquette HTML complète style Casa = démonstration de force).
      DA pressentie : "Dark Mediterranean Grill Lounge" (cf analyse-prebrief.md).
      Réseaux : Instagram @anamour28chartres ; univers marque : chezanamour.fr.
