# Galerie photo du resto. Liste éditée par le patron via Decap CMS.
# Auto-hide intelligent : si moins de 4 photos uploadées, la section est cachée
# au build (logique dans src/lib/conditions.ts → shouldShowGalerie).
#
# Pour le cas zéro Kroosti, on a 1 vraie photo (foodtruck.jpg) + 3 placeholders
# Picsum à remplacer par les vraies photos du resto (plats signature, salle,
# équipe). En vrai usage client, le patron upload les photos via Decap CMS.

galerie:
  photos:
    - src: "/images/foodtruck.jpg"
      alt: "Kroosti Yummy — le foodtruck en service à Chartres"
      legende: "Le foodtruck en service"
    - src: "https://picsum.photos/seed/kroosti-riz/1200/1200"
      alt: "Bol de riz Kroosti — poulet croustillant maison"
      legende: "Le Riz Kroosti, notre signature"
    - src: "https://picsum.photos/seed/kroosti-croq/1200/1200"
      alt: "Croq Kroosti — blanc de poulet et cheddar fondant"
      legende: "Le Croq Kroosti, à 2,50€"
    - src: "https://picsum.photos/seed/kroosti-equipe/1200/1200"
      alt: "L'équipe Kroosti Yummy en plein service"
      legende: "L'équipe au feu"
    - src: "https://picsum.photos/seed/kroosti-marche/1200/1200"
      alt: "Le foodtruck Kroosti Yummy au marché de Chartres"
      legende: "Mercredi midi au marché"
    - src: "https://picsum.photos/seed/kroosti-sauce/1200/1200"
      alt: "Préparation de la sauce Yummy maison"
      legende: "La sauce Yummy, maison"
