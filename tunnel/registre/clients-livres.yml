# ============================================
# CATALOGUE DE DIMENSIONS
# ============================================
# Référence des valeurs possibles pour chaque dimension.
# Voir doctrine/02-anti-jumeau-da.md pour les détails.

dimensions_catalogue:

  directions_artistiques:
    - Dark_Lounge              # Nocturne intime (Anamour)
    - Bistrot_Patine           # Bois ancien, tradition française
    - Mediterraneen_Solaire    # Blanc/bleu, chaleur diurne (Al Badea)
    - Tropical_Vivant          # Saturé, festif (Casa Tropical)
    - Gastro_Marbre            # Marbre clair, élégance contemporaine
    - Tradition_Bois           # Rustique terroir
    - Fast_Casual_Pop          # Dopamine, rapide
    - Editorial_Magazine       # Contemplatif (Terra)

  packs_typo:
    - Editorial_Serif_Bleu     # Sérif éditorial + bleu profond (Al Badea)
    - Editorial_Serif_Italique # Sérif italique magazine (Casa Tropical)
    - Lounge_Sensuel           # Display + serif élégant (Anamour)
    - Modern_Soft              # Sans-serif moderne adouci
    - Bistrot_Classic          # Classique français
    - Display_Bold             # Display impactant
    - Pop_Energique            # Anton + Source Sans

  structures_hero:
    - Direct                   # Headline + CTA, photo background (Al Badea)
    - Editorial_Photo_Equipe   # Photo équipe + texte (Casa Tropical)
    - Cinematique              # Photo plein écran, texte minimal (Anamour)
    - Split                    # 50/50 photo/texte
    - Carrousel_Ambiance       # Plusieurs photos défilantes

  spines_commerciaux:
    - VENIR                    # Faire venir physiquement (Al Badea)
    - RESERVER                 # Réservation (Anamour, Casa Tropical)
    - APPELER                  # Appel téléphonique direct
    - COMMANDER                # Vente à emporter / livraison
    - DECOUVRIR                # Éducation marché (nouveaux)

  tons_copy:
    - Sensoriel_premium        # Phrases courtes, lexique élevé (Anamour)
    - Chaleureux_populaire     # Quotidien, proximité (Al Badea, Casa Tropical)
    - Editorial_discret        # Phrases longues, vocabulaire riche
    - Pop_energique            # Court, dopamine
    - Tradition_assumee        # Patrimonial, ancrage terroir
