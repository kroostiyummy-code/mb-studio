# Ce fichier liste toutes les combinaisons utilisées pour garantir l'unicité.
# Voir doctrine/02-anti-jumeau-da.md pour les règles complètes.
#
# Règle stricte : aucun nouveau client ne peut avoir la même combinaison
# sur les 5 dimensions (DA + Pack typo + Hero + Spine + Ton).
# Pour 2 restos du même type de cuisine : minimum 3/5 dimensions différentes.

